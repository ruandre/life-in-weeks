# Three days of quarantine before any newly published version is installable
minimumReleaseAge: 4320

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3

allowBuilds:
  '@google/genai': true
  protobufjs: true

# Security fixes for transitive dev dependencies; drop once dependents require them
overrides:
  # GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p; reached via minimatch ^5.0.8
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  # GHSA-px8p-9vwx-vf98; satori pins 0.7.3, 0.7.5 only changes ZIP code it does not use
  fflate@>=0.7.0 <0.7.5: ^0.7.5
  # GHSA-rj75-hqrm-r3gf; reached via svelte-eslint-parser and eslint-plugin-vue
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  # GHSA-68fv-2mgg-jv7q; reached via postcss and css-tree
  source-map-js@<1.2.2: ^1.2.2
  # GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr; oxfmt pins 2.1.0
  tinypool@<2.1.2: ^2.1.2
